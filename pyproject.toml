[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "1.0.0"
description = "LLM Agent 质量保障 Harness：功能评测 + 性能压测一体化框架"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "agent-harness contributors" },
]
keywords = ["llm", "agent", "evaluation", "testing", "sse", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[project.urls]
Documentation = "https://github.com/AlexJ1ang/agent-harness#readme"
Issues = "https://github.com/AlexJ1ang/agent-harness/issues"
Source = "https://github.com/AlexJ1ang/agent-harness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tests/"]
